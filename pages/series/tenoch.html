<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toriku Films | Seashore Lust</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Inter, Cinzel, and Labrada -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Cinzel:wght@400;700;900&family=Labrada:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <style>
        html { scroll-behavior: smooth; }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0a0a0b !important; 
            color: #f0f0f0; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            position: relative;
        }

        /* THE PATTERN LAYER - Updated reference to ciudadela.png */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('/media/posters/dynasties/ciudadela.png'); 
            background-repeat: repeat;
            background-size: 400px;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            filter: grayscale(100%) contrast(120%);
        }

        /* Labrada Font Implementation - SEASHORE LUST Style */
        .font-distressed {
            font-family: 'Labrada', serif;
            font-weight: 900;
            text-transform: uppercase;
            color: #E3DAC9;
            background: linear-gradient(to bottom, #E3DAC9 40%, #b5ad9d 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 15px rgba(0, 0, 0, 0.8));
            letter-spacing: 0.05em;
        }

        /* Standardized Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0b; }
        ::-webkit-scrollbar-thumb { 
            background: #C02F12; 
            border-radius: 10px; 
        }

        /* THE DISSOLVE EFFECT */
        .header-mask {
            mask-image: linear-gradient(to bottom, 
                black 0%, 
                black 70%, 
                rgba(0,0,0,0.5) 90%, 
                transparent 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, 
                black 70%, 
                rgba(0,0,0,0.5) 90%, 
                transparent 100%
            );
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px;}
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(250, 235, 215, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C02F12; border-radius: 10px; }

        .font-serif { font-family: 'Labrada', 'Cinzel', serif; }

        .animate-zoom { animation: zoom 0.3s ease-out; }
        @keyframes zoom {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const SERIES_DETAILS = {
            title: "SEASHORE LUST",
            genre: "Fantasy • Sci-fi • Blood",
            description: "A tribe is as big as the smallest member of it. When a man leaves to find better fortune, there's no small story that's left behind.",
            heroImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=2000", 
            chapters: [
                { id: 1, num: "01", title: "Peak of Tolerance", duration: "24:00" },
                { id: 2, num: "02", title: "Fractured Zenith", duration: "23:45" },
                { id: 3, num: "03", title: "Aether & Iron", duration: "24:12" },
                { id: 4, num: "04", title: "The Blood Seal", duration: "23:58" },
                { id: 5, num: "05", title: "Sovereign Debt", duration: "24:05" },
                { id: 6, num: "06", title: "Horizon Ablaze", duration: "24:00" },
            ]
        };

        const SCREENSHOTS = [
            { id: 1, url: "/media/posters/dynasties/The_grid.PNG", caption: "The Grid" },
            { id: 2, url: "/media/posters/dynasties/The_hunt.png", caption: "The Hunt" },
            { id: 3, url: "/media/posters/dynasties/Lost.png", caption: "Lost" },
            { id: 4, url: "/media/posters/dynasties/Admoni_river.png", caption: "Admoni River" },
        ];

        const CAST = [
            { id: 1, name: "Soren Valerius", role: "High Archon" },
            { id: 2, name: "Lyra Thorne", role: "Pilot" },
            { id: 3, name: "Kaelen Voss", role: "Diplomat" },
            { id: 4, name: "Elara Vance", role: "Oracle" },
        ];

        const SectionHeader = ({ title }) => (
            <div className="flex items-center gap-3 mb-8">
                <span className="w-1.5 h-6 bg-[#C02F12] rounded-full"></span>
                <h2 className="text-xl md:text-2xl font-serif text-white tracking-wide uppercase">{title}</h2>
            </div>
        );

        const Lightbox = ({ image, onClose }) => {
            if (!image) return null;
            return (
                <div 
                    className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 md:p-12 transition-all"
                    onClick={onClose}
                >
                    <button className="absolute top-8 right-8 text-white/50 hover:text-white text-4xl transition-colors">&times;</button>
                    <div className="relative max-w-6xl w-full animate-zoom" onClick={e => e.stopPropagation()}>
                        <img src={image.url} alt={image.caption} className="w-full h-auto rounded-lg shadow-2xl border border-white/10" />
                        <div className="mt-6 flex items-center gap-4">
                            <span className="w-8 h-[1px] bg-[#C02F12]"></span>
                            <h3 className="text-white font-serif text-2xl italic">{image.caption}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenshotPreviewRow = ({ onImageClick }) => {
            const scrollRef = React.useRef(null);
            return (
                <section className="mb-32 relative group">
                    <SectionHeader title="Visual Codex" />
                    <div className="flex gap-4 overflow-x-auto scroll-smooth pb-4 custom-scrollbar" ref={scrollRef}>
                        {SCREENSHOTS.map((shot) => (
                            <div 
                                key={shot.id} 
                                className="flex-none w-64 group/item cursor-pointer"
                                onClick={() => onImageClick(shot)}
                            >
                                <div className="aspect-[16/10] rounded-xl overflow-hidden border border-white/10 group-hover/item:border-[#C02F12] transition-all relative">
                                    <img src={shot.url} className="w-full h-full object-cover opacity-80 group-hover/item:scale-110 group-hover/item:opacity-100 transition-all duration-700" />
                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center justify-center">
                                        <div className="px-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full scale-90 group-hover/item:scale-100 transition-transform">
                                            <span className="text-white text-[10px] font-bold tracking-widest uppercase">Inspect Frame</span>
                                        </div>
                                    </div>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                                    <p className="absolute bottom-3 left-4 text-white text-[10px] font-black tracking-widest uppercase">{shot.caption}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const App = () => {
            const [activeImage, setActiveImage] = React.useState(null);

            return (
                <div className="min-h-screen bg-transparent">
                    <Lightbox image={activeImage} onClose={() => setActiveImage(null)} />

                    <header className="relative w-full h-[80vh] md:h-[95vh] overflow-hidden bg-transparent header-mask">
                        <div 
                            className="absolute inset-0 bg-cover bg-center bg-no-repeat"
                            style={{ backgroundImage: `url(${SERIES_DETAILS.heroImage})` }}
                        />

                        <div className="absolute bottom-32 left-8 md:left-24 z-10 max-w-5xl">
                            <div className="flex items-center gap-3 mb-6">
                                <span className="bg-[#C02F12] text-white text-[10px] font-black px-3 py-1.5 rounded uppercase tracking-[0.2em]">Live Session</span>
                                <span className="text-white/80 text-sm font-bold tracking-widest uppercase">{SERIES_DETAILS.genre}</span>
                            </div>

                            <h1 className="text-7xl md:text-[8.5rem] font-distressed leading-[0.85] mb-4">
                                {SERIES_DETAILS.title}
                            </h1>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-8 py-24 relative z-10">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start mb-40">
                            <div className="lg:col-span-5 bg-[#0a0a0b]/60 border border-white/10 rounded-3xl p-10 backdrop-blur-xl shadow-2xl">
                                <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                    <h3 className="text-white font-serif text-2xl font-bold italic tracking-tight">Season 1 Manifest</h3>
                                    <span className="text-[#C02F12] text-[10px] font-black uppercase tracking-widest">Active</span>
                                </div>
                                <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                    {SERIES_DETAILS.chapters.map((c) => (
                                        <div key={c.id} className="flex items-center justify-between p-4 rounded-xl hover:bg-[#C02F12]/10 transition-all cursor-pointer group">
                                            <span className="text-white/60 text-sm font-medium group-hover:text-white transition-colors uppercase tracking-widest">{c.title}</span>
                                            <span className="text-[#C02F12] text-[10px] font-mono font-bold">{c.duration}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="lg:col-span-7 pt-4">
                                <SectionHeader title="The Narrative" />
                                <p className="text-2xl md:text-3xl text-white/90 leading-tight font-light mb-10 italic border-l-8 border-[#C02F12] pl-10 py-2">
                                    {SERIES_DETAILS.description}
                                </p>
                                <button className="group relative px-12 py-5 overflow-hidden rounded-full bg-white text-black font-black text-xs uppercase tracking-[0.3em] transition-all hover:pr-16">
                                    <span className="relative z-10">Enter Realm</span>
                                    <span className="absolute right-6 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all">→</span>
                                </button>
                            </div>
                        </div>

                        <ScreenshotPreviewRow onImageClick={(img) => setActiveImage(img)} />

                        <section className="mb-40">
                            <SectionHeader title="The Council" />
                            <div className="flex flex-wrap gap-10 md:gap-16">
                                {CAST.map((p) => (
                                    <div key={p.id} className="group text-center">
                                        <div className="w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-br from-white/10 to-transparent border border-white/10 mb-6 overflow-hidden group-hover:border-[#C02F12] transition-all flex items-center justify-center relative shadow-2xl backdrop-blur-sm">
                                            <span className="text-white/5 text-5xl font-serif group-hover:text-[#C02F12]/40 transition-all">{p.name.charAt(0)}</span>
                                        </div>
                                        <h4 className="text-white text-base font-bold tracking-tight mb-1">{p.name}</h4>
                                        <p className="text-[#C02F12] text-[10px] uppercase font-black tracking-[0.2em]">{p.role}</p>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    <footer className="border-t border-white/5 py-16 px-8 text-center bg-[#0a0a0b] relative z-10">
                        <p className="text-white/10 text-[9px] tracking-[0.6em] uppercase font-bold">
                            &copy; 2026 Toriku Films • Excellence in Narrative Animation
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
